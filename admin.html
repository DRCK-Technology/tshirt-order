<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Batch - Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="admin-container">
        <h2>Tech Batch - T-Shirt Orders Admin</h2>
        <p>Manage student orders, view payment slips, and approve status live.</p>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Admission</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Phone</th>
                        <th>Size</th>
                        <th>Method</th>
                        <th>Slip</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 20px;">Loading orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="slipModal" class="modal">
        <span class="close-modal" onclick="closeSlipModal()">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
