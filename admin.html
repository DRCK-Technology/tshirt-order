<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Batch - Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- 🔐 1. LOGIN BOX -->
    <div id="loginBox" style="max-width: 400px; margin: 100px auto; padding: 30px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); text-align: center; font-family: sans-serif;">
        <h2 style="color: #fff; margin-bottom: 20px;">Admin Login</h2>
        <input type="password" id="adminPassInput" placeholder="Enter Password" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; background: rgba(255,255,255,0.2); color: #fff; text-align: center; font-size: 16px; box-sizing: border-box;">
        <button onclick="checkLogin()" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00ff88; color: #000; font-weight: bold; cursor: pointer; font-size: 16px;">Login</button>
    </div>

    <!-- 📊 2. ADMIN CONTENT
    <div id="adminContent" style="display: none;">

        <div class="print-only-title">
                <center><h1>DHAMARAJA COLLEGE - KANDY</h1>
                <h2>Technology Section - Official '27 Batch T-Shirt Orders List</h2></center>
                <hr style="border: 1px solid #000; margin-top: 10px;">
        </div>

        <div class="admin-container">
            <div class="admin-header">
                <h2>Tech Batch - T-Shirt Orders Admin</h2>
                <p>Manage student orders, view payment slips, and approve status live.</p>
            
                <!-- 📈 Summary Cards Wrapper -->
                <div class="summary-wrapper">
                    <div class="summary-card total-card">
                        <h3>Total Orders</h3>
                        <div class="count-value" id="sumTotalOrders">0</div>
                    </div>

                    <div class="summary-card sizes-card">
                        <h3>Size Requirements Count</h3>
                        <div class="sizes-grid">
                            <div class="size-box"><span>XS</span><strong id="sizeXS">0</strong></div>
                            <div class="size-box"><span>S</span><strong id="sizeS">0</strong></div>
                            <div class="size-box"><span>M</span><strong id="sizeM">0</strong></div>
                            <div class="size-box"><span>L</span><strong id="sizeL">0</strong></div>
                            <div class="size-box"><span>XL</span><strong id="sizeXL">0</strong></div>
                            <div class="size-box"><span>XXL</span><strong id="sizeXXL">0</strong></div>
                            <div class="size-box"><span>3XL</span><strong id="size3XL">0</strong></div>
                            <div class="size-box"><span>4XL</span><strong id="size4XL">0</strong></div>
                        </div>
                    </div>

                    <div class="summary-card payment-card">
                        <h3>Payment Methods</h3>
                        <div class="pay-info-row">
                            <span>💸 Cash Transfer:</span>
                            <strong id="sumCash">0</strong>
                        </div>
                        <div class="pay-info-row">
                            <span>🏦 Bank / Slip:</span>
                            <strong id="sumBank">0</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 🔍 Search, Filter & Refresh Controls Panel -->
            <div class="TC" style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 20px 0; flex-wrap: wrap; gap: 15px;">
                <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                    <input type="text" id="adminSearchInput" onkeyup="filterAdminTable()" placeholder="Search by Name or Admission No..." style="padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; width: 280px; backdrop-filter: blur(5px);">
                    <button class="liquid-btn small" onclick="filterStatus('all')" style="padding: 10px 15px; font-size: 14px; cursor: pointer; border-radius: 8px; background: white; font-weight: 600; border: none;">All Orders</button>
                    <button class="liquid-btn small" onclick="filterStatus('pending')" style="padding: 10px 15px; font-size: 14px; background: #ffcc00; color: black; cursor: pointer; border: none; border-radius: 6px; font-weight: bold;">Pending</button>
                    <button class="liquid-btn small" onclick="filterStatus('done')" style="padding: 10px 15px; font-size: 14px; background: #00ff88; color: black; cursor: pointer; border: none; border-radius: 6px; font-weight: bold;">Approved</button>
                </div>
                <button onclick="refreshTableOnly()" id="refreshBtn" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #00ff88; background: transparent; color: #00ff88; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s;">
                    🔄 Refresh Table
                </button>
            </div>

            <!-- 📋 Table Section -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Admission</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Phone</th>
                            <th>Size</th>
                            <th>Method</th>
                            <th>Slip</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr>
                            <td colspan="9" style="text-align: center; padding: 20px;">Loading orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 🖼️ Slip Modal -->
        <div id="slipModal" class="modal">
            <span class="close-modal" onclick="closeSlipModal()">&times;</span>
            <img class="modal-content" id="modalImage">
        </div>

    </div>

    <script src="js/admin.js"></script>
</body>
</html>
