<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Batch - Analytics Dashboard</title>
    <!-- Liquid Glass theme styles -->
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/Analytics.css">
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- 🔐 1. LOGIN BOX -->
    <div id="loginBox" style="max-width: 400px; margin: 100px auto; padding: 30px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); text-align: center; font-family: sans-serif;">
        <h2 style="color: #fff; margin-bottom: 20px;">Admin Login</h2>
        <input type="password" id="adminPassInput" placeholder="Enter Password" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; background: rgba(255,255,255,0.2); color: #fff; text-align: center; font-size: 16px; box-sizing: border-box;">
        <button onclick="checkLogin()" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00ff88; color: #000; font-weight: bold; cursor: pointer; font-size: 16px;">Login</button>
    </div>

    <!-- 📊 2. ANALYTICS CONTENT -->
    <div id="adminContent" style="display: none;">
        <div class="admin-container">
            
            <div class="admin-header">
                <!-- 🌐 Navigation Wrapper (Full Width Header) -->
                <div class="page-nav-wrapper">
                    <div class="nav-links">
                        <a href="admin_late.html" class="nav-btn">📋 Orders List</a>
                        <a href="#" class="nav-btn active">📊 Live Analytics</a>
                    </div>
    
                    <div class="theme-switch-segmented">
                        <!-- Sliding Bubble -->
                        <div class="thumb-slider" id="thumbSlider"></div>
    
                        <div class="theme-icon-option active" onclick="setDashboardTheme('dark', 0)">🌙</div>
                            <div class="theme-icon-option" onclick="setDashboardTheme('light', 1)">☀️</div>
                        <div class="theme-icon-option" onclick="setDashboardTheme('cyber', 2)">👾</div>
                </div>
                </div>

<!-- 🔄 Refresh Row (Original Right Side Position) -->
<div class="analytics-control-row">
    <button onclick="refreshChartsOnly()" id="refreshChartsBtn">
        <span class="btn-icon">🔄</span> Refresh Analytics Data
    </button>
</div>
                
            <!-- 🗺️ Charts Grid Layout -->
            <div class="charts-grid">
    
                <!-- Chart 1: Bar Chart for Classes (With Stats Side-by-Side) -->
                <div class="chart-card wide-card">
                    <h3>Class-wise Orders Distribution</h3>
                    <div class="chart-layout-flex">
                        <!-- Chart Container (70% width) -->
                        <div class="chart-container-half">
                            <canvas id="classesBarChart"></canvas>
                        </div>
                        <!-- Insights Panel (30% width) -->
                        <div class="chart-insights-panel">
                            <div class="insight-box top-class-box">
                                <span>🔥 Top Ordering Class</span>
                                <strong id="topClassName">-</strong>
                                <small id="topClassCount">0 Orders</small>
                            </div>
                            <div class="insight-box low-class-box">
                                <span>⚠️ Lowest Class</span>
                                <strong id="lowClassName">-</strong>
                                <small id="lowClassCount">0 Orders</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chart 2: Pie Chart for T-Shirt Sizes -->
                <div class="chart-card">
                    <h3>T-Shirt Size Percentages</h3>
                    <div class="chart-container">
                        <canvas id="sizesPieChart"></canvas>
                    </div>
                </div>

                <!-- Chart 3: Donut Chart for Payment Methods -->
                <div class="chart-card">
                    <h3>Payment Methods Summary</h3>
                    <div class="chart-container">
                        <canvas id="paymentsDonutChart"></canvas>
                    </div>
                </div>

            </div> 
        </div> 
    </div> 

    <!-- External Analytics JS Logic -->
    <script src="js/Analytics_late.js"></script>
</body>
</html>
